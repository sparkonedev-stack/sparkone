<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>SparkOne - Building the New Star of Intelligence</title>
    <style>
        /* (ใส่ CSS เดิมของคุณที่นี่ได้เลยครับ เพื่อความสั้นผมย่อไว้ให้) */
        :root { --bg-color: #050505; --card-bg: #0f0f12; --accent-color: #ffffff; --text-muted: #a1a1aa; }
        body { background-color: var(--bg-color); color: #e4e4e7; font-family: sans-serif; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; padding: 1.2rem 2rem; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        /* สไตล์โพสต์ */
        .post-card { background: var(--card-bg); border: 1px solid #27272a; padding: 2.5rem; margin-bottom: 2rem; border-radius: 12px; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo-section">SPARKONE</div>
            <nav>
                <a onclick="switchView('home')" id="nav-home" class="active">หน้าหลัก</a>
                <a onclick="switchView('updates')" id="nav-updates">ข่าวสาร</a>
                <a onclick="switchView('contact')" id="nav-contact">ติดต่อเรา</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- หน้าหลัก -->
        <section id="view-home" class="view-section active">
            <h1>BUILDING THE NEW STAR OF INTELLIGENCE.</h1>
            <!-- เนื้อหา Hero และ Vision อื่นๆ เดิมของคุณ -->
        </section>

        <!-- หน้าอัปเดต (ดึงโพสต์มาแสดงตรงนี้) -->
        <section id="view-updates" class="view-section">
            <div class="feed-container">
                <h2>ความคืบหน้าและการพัฒนา</h2>
                <div id="posts-target"></div>
            </div>
        </section>

        <!-- หน้าติดต่อเรา -->
        <section id="view-contact" class="view-section">
            <h2>ติดต่อเรา</h2>
        </section>
    </main>

    <script>
        // ข้อมูลจำลอง (ในอนาคตคุณสามารถดึงจากไฟล์ JSON หรือ API ได้)
        let posts = [{ id: 1, title: "ยินดีต้อนรับสู่โปรเจกต์ NOVA", category: "Announcement", date: "1 มิถุนายน 2569", content: "เริ่มการพัฒนา...", image: "" }];

        function switchView(v) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById('view-' + v).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPosts() {
            const t = document.getElementById('posts-target');
            t.innerHTML = posts.map(p => `
                <div class="post-card">
                    <div class="post-meta"><span class="post-tag">${p.category}</span> • ${p.date}</div>
                    <h3>${p.title}</h3>
                    <p>${p.content}</p>
                    ${p.image ? `<img src="${p.image}" class="post-img">` : ''}
                </div>
            `).join('');
        }
        renderPosts();
    </script>
</body>
</html>
