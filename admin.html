<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แอดมินพอร์ทัล - SparkOne</title>
    <style>
        :root { --bg-color: #050505; --card-bg: #0f0f12; --accent-color: #ffffff; --text-color: #e4e4e7; --text-muted: #a1a1aa; --border-color: #27272a; --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; } 
        * { box-sizing: border-box; margin: 0; padding: 0; } 
        body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); line-height: 1.6; padding: 4rem 2rem; }
        .admin-container { max-width: 700px; margin: 0 auto; background: var(--card-bg); border: 1px solid var(--border-color); padding: 3rem; border-radius: 16px; } 
        .admin-container h2 { margin-bottom: 1.5rem; font-size: 1.8rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; color: var(--accent-color); } 
        .form-group { margin-bottom: 1.5rem; } 
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted); } 
        .form-group input, .form-group textarea, .form-group select { width: 100%; background: #050505; border: 1px solid var(--border-color); border-radius: 8px; padding: 0.8rem 1rem; color: var(--text-color); font-family: var(--font-family); font-size: 1rem; outline: none; transition: border-color 0.2s; } 
        .btn { background: var(--accent-color); color: #000000; border: none; padding: 0.8rem 2rem; font-weight: 600; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: opacity 0.2s; margin-bottom: 1rem;} 
        .btn:hover { opacity: 0.9; }
        .btn:disabled { background: #3f3f46; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2>แอดมินจัดการระบบ</h2>
        <form id="post-form">
            <div class="form-group">
                <label>หัวข้อข่าวสาร / อัปเดต</label>
                <input type="text" id="post-title" required>
            </div>
            <div class="form-group">
                <label>หมวดหมู่อัปเดตระบบ</label>
                <select id="post-category">
                    <option value="ประกาศสำคัญ">ประกาศสำคัญ</option>
                    <option value="อัปเดตระบบ">อัปเดตระบบ</option>
                </select>
            </div>
            <div class="form-group">
                <label>เนื้อหาบทความ</label>
                <textarea id="post-content" rows="6" required></textarea>
            </div>
            <div class="form-group">
                <label>อัปโหลดรูปภาพประกอบ (ระบุหรือไม่ก็ได้)</label>
                <input type="file" id="imageInput" accept="image/*">
                <img id="preview" style="width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; margin-top: 1.5rem; display: none; border: 1px solid var(--border-color);">
            </div>
            <button type="submit" id="submitBtn" class="btn">เผยแพร่อัปเดต</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFVUtZCTAp_9zSAyrUloNJL62jmpA9xd0",
            authDomain: "sparkone-8a4cd.firebaseapp.com",
            projectId: "sparkone-8a4cd",
            storageBucket: "sparkone-8a4cd.firebasestorage.app",
            messagingSenderId: "18493406888",
            appId: "1:18493406888:web:29c39352229a8ca30bcc9d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        let selectedImage = "null";

        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    selectedImage = e.target.result; 
                };
                reader.readAsDataURL(file);
            } else {
                preview.style.display = 'none';
                selectedImage = "null";
            }
        });

        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "กำลังเผยแพร่...";

            const title = document.getElementById('post-title').value;
            const category = document.getElementById('post-category').value;
            let content = document.getElementById('post-content').value;
            content = content.replace(/\n/g, '<br>');

            const today = new Date();
            const dateStr = `${today.getDate()} ${today.toLocaleString('th-TH', { month: 'long' })} ${today.getFullYear() + 543}`;

            try {
                await addDoc(collection(db, "posts"), {
                    title: title,
                    category: category,
                    content: content,
                    image: selectedImage,
                    dateStr: dateStr,
                    createdAt: Date.now()
                });
                alert("โพสต์ข้อมูลสำเร็จ! เช็คหน้าเว็บหลักได้เลยครับ");
                document.getElementById('post-form').reset();
                preview.style.display = 'none';
                selectedImage = "null";
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("เกิดข้อผิดพลาดในการโพสต์ข้อมูล");
            } finally {
                btn.disabled = false;
                btn.innerText = "เผยแพร่อัปเดต";
            }
        });
    </script>
</body>
</html>
